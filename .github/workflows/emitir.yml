# Emisión de un documento aprobado.
# El aprobador crea el tag doc/<código>/<revisión> sobre el commit de main en que el
# documento está «Aprobado» (desde el gestor: botón «Emitir»). Este flujo comprueba
# que es válido, genera PDF + manifiesto y abre una propuesta que los añade a
# publicados/ (inmutable). Solo el aprobador o un líder pueden crear esos tags
# (regla de tags en GitHub) y el flujo vuelve a comprobarlo con equipo.toml.
name: Emitir

on:
  push:
    tags: ["doc/**"]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  emitir:
    # En Windows para que el PDF oficial use exactamente las mismas fuentes que el equipo.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Typst
        run: |
          V=$(tr -d '[:space:]' < herramientas/typst-version.txt)
          curl -fsSL -o typst.zip "https://github.com/typst/typst/releases/download/v${V}/typst-x86_64-pc-windows-msvc.zip"
          unzip -q typst.zip -d /c/typst && rm typst.zip
          echo "C:\\typst\\typst-x86_64-pc-windows-msvc" >> "$GITHUB_PATH"

      - name: Comprobar y generar la emisión
        id: emision
        run: |
          python herramientas/alimoche_ci.py emitir "${GITHUB_REF_NAME}" --actor "${GITHUB_ACTOR}" | tee salida.txt
          echo "pdf=$(grep '\.pdf$' salida.txt)" >> "$GITHUB_OUTPUT"
          echo "manifiesto=$(grep '\.toml$' salida.txt)" >> "$GITHUB_OUTPUT"

      - name: Publicar como versión de GitHub (consulta inmediata)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.emision.outputs.pdf }}" "${{ steps.emision.outputs.manifiesto }}" \
            --title "Emisión ${GITHUB_REF_NAME#doc/}" --notes "Emitido por @${GITHUB_ACTOR} desde ${GITHUB_SHA}." --verify-tag

      - name: Proponer la incorporación a publicados/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAMA="emision/$(echo "${GITHUB_REF_NAME#doc/}" | tr '/' '-')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMA" origin/main
          git add "${{ steps.emision.outputs.pdf }}" "${{ steps.emision.outputs.manifiesto }}"
          git commit -m "Emisión ${GITHUB_REF_NAME#doc/}"
          git push origin "$RAMA"
          gh pr create --base main --head "$RAMA" --title "Emisión ${GITHUB_REF_NAME#doc/}" \
            --body "Añade a publicados/ la emisión creada por el tag \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA}). Generado automáticamente."
          # Las propuestas creadas con GITHUB_TOKEN no disparan workflows: se lanza la validación a mano.
          gh workflow run validar.yml --ref "$RAMA"
